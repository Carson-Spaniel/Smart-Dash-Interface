name: Build Installer

on:
  push:
    branches:
      - main
    paths:
      - "scripts/install.sh.in"
      - ".github/workflows/build-installer.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Generate Installer
    runs-on: ubuntu-latest

    steps:
      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================
      # Generate installer
      # ========================================================

      - name: Generate install.sh
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          sed \
            -e "s|@REPO_OWNER@|${REPO_OWNER}|g" \
            -e "s|@REPO_NAME@|${REPO_NAME}|g" \
            -e "s|@REPO_BRANCH@|${REPO_BRANCH}|g" \
            scripts/install.sh.in \
            > scripts/install.sh

          chmod +x scripts/install.sh

      # ========================================================
      # Validate generated installer
      # ========================================================

      - name: Validate generated installer
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/install.sh

          if grep -qE '@REPO_(OWNER|NAME|BRANCH)@' scripts/install.sh; then
            echo "ERROR: Unreplaced template variables found:"
            grep -nE '@REPO_(OWNER|NAME|BRANCH)@' scripts/install.sh
            exit 1
          fi

          echo "Generated installer is valid."

      # ========================================================
      # Commit generated installer
      # ========================================================

      - name: Commit generated installer
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/install.sh

          if git diff --cached --quiet; then
            echo "install.sh is already up to date."
            exit 0
          fi

          git commit -m "chore: generate install.sh"

          git push