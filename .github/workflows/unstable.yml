name: Unstable Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ==================================================================
  # Build + Scan + Publish
  # ==================================================================

  build-publish:
    name: Build, Scan & Publish Unstable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------------
      # Log into GHCR
      # --------------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------
      # Generate Docker metadata
      # --------------------------------------------------------------

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=unstable
            type=sha,prefix=unstable-

      # --------------------------------------------------------------
      # Build and push multi-architecture image
      #
      # Raspberry Pi 4:
      #     linux/arm64
      #
      # Other systems:
      #     linux/amd64
      # --------------------------------------------------------------

      - name: Build and push unstable image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          provenance: mode=max
          sbom: true

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------------
      # Publish build provenance / attestation
      # --------------------------------------------------------------

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # --------------------------------------------------------------
      # Summary
      # --------------------------------------------------------------

      - name: Image summary
        run: |
          echo "Published:"
          echo "${{ env.IMAGE_NAME }}:unstable"
          echo "${{ env.IMAGE_NAME }}:unstable-${GITHUB_SHA}"
          echo ""
          echo "Digest:"
          echo "${{ steps.push.outputs.digest }}"