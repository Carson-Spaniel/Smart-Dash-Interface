name: CI

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ==================================================================
  # Lint
  # ==================================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .


  # ==================================================================
  # Tests
  # ==================================================================

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest


  # ==================================================================
  # Docker Build + Security Scan
  #
  # This intentionally does NOT push anything to GHCR.
  #
  # We build ARM64 because that is the architecture used by the
  # Raspberry Pi 4.
  # ==================================================================

  docker:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------------
      # Build ARM64 image into the local Docker image store.
      #
      # load: true makes the image available locally for Trivy.
      # --------------------------------------------------------------

      - name: Build ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: smart-dash:ci-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------------
      # Vulnerability scan
      #
      # Scans the actual ARM64 image that was just built.
      #
      # The build fails if HIGH or CRITICAL vulnerabilities are found.
      # Unfixed vulnerabilities are ignored.
      # --------------------------------------------------------------

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: smart-dash:ci-${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "0"