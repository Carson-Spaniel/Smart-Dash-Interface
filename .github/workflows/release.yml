name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0 or v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ==================================================================
  # Validate release version
  # ==================================================================

  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            echo ""
            echo "Expected:"
            echo "  v1.2.3"
            echo "  v1.2.3-rc.1"
            echo "  v1.2.3-rc.2"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version: $VERSION"


  # ==================================================================
  # Build and publish release
  # ==================================================================

  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      # --------------------------------------------------------------
      # Verify that the release is being created from main.
      # --------------------------------------------------------------

      - name: Verify main is checked out
        run: |
          git fetch origin main

          MAIN_SHA="$(git rev-parse origin/main)"
          CURRENT_SHA="$(git rev-parse HEAD)"

          echo "Main SHA:    $MAIN_SHA"
          echo "Current SHA: $CURRENT_SHA"

          if [ "$MAIN_SHA" != "$CURRENT_SHA" ]; then
            echo "ERROR: Release must be created from the current main branch."
            exit 1
          fi

      # --------------------------------------------------------------
      # Create release tag
      # --------------------------------------------------------------

      - name: Create release tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "ERROR: Tag $VERSION already exists."
            exit 1
          fi

          git tag "$VERSION"
          git push origin "$VERSION"

      # --------------------------------------------------------------
      # Set up Docker
      # --------------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------------
      # Log into GHCR
      # --------------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------
      # Docker metadata
      # --------------------------------------------------------------

      - name: Extract Docker metadata
        id: meta
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}

            # Only stable releases receive :latest.
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-rc.') }}

      # --------------------------------------------------------------
      # Build and publish release
      # --------------------------------------------------------------

      - name: Build and push release image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          provenance: mode=max
          sbom: true

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------------
      # Generate artifact attestation
      # --------------------------------------------------------------

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # --------------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ "$VERSION" == *"-rc."* ]]; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --prerelease \
              --generate-notes
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --latest \
              --generate-notes
          fi

      # --------------------------------------------------------------
      # Summary
      # --------------------------------------------------------------

      - name: Release summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          echo "============================================"
          echo "Smart Dash Release"
          echo "============================================"
          echo ""
          echo "Version:"
          echo "  $VERSION"
          echo ""
          echo "Docker image:"
          echo "  ${{ env.IMAGE_NAME }}:$VERSION"
          echo ""
          echo "Digest:"
          echo "  ${{ steps.push.outputs.digest }}"