services:
  smart-dash:
    image: ghcr.io/@REPO_OWNER@/@REPO_NAME@:latest

    container_name: smart-dash

    restart: unless-stopped

    # Load Smart Dash configuration generated by install.sh.
    env_file:
      - .env

    volumes:
      # X11 socket for displaying the Qt application
      # on the Raspberry Pi desktop.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # Persistent Smart Dash application data
      - smart-dash-data:/root/.config/smart-dash

volumes:
  smart-dash-data: