[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "smart-dash"
version = "0.1.0"
description = "OBD-II smart dashboard interface"
requires-python = ">=3.12"

dependencies = [
    "PySide6-Essentials>=6.8",
    "PySide6-Addons>=6.8",
    "obd>=0.7.2",
]


[project.optional-dependencies]
dev = [
    "PySide6>=6.8",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "pre-commit>=4.0",
]


[project.scripts]
smart-dash = "app.main:main"


# ============================================================
# Python packages
# ============================================================

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


# ============================================================
# Package data
# ============================================================
#
# Include all QML files and the qmldir files used by Qt QML
# modules/singletons when the application is installed.
#

[tool.setuptools.package-data]
app = [
    "ui/qml/*.qml",
    "ui/qml/**/*.qml",
    "ui/qml/**/*.js",
    "ui/qml/**/*.png",
    "ui/qml/**/*.jpg",
    "ui/qml/**/*.jpeg",
    "ui/qml/**/*.svg",
    "ui/qml/**/qmldir",
]


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"


# ============================================================
# Ruff
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 160

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]


[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
]


[tool.ruff.lint.isort]
split-on-trailing-comma = false


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true