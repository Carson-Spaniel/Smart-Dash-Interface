[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "smart-dash"
version = "0.1.0"
description = "OBD-II smart dashboard interface"
requires-python = ">=3.12"

dependencies = [
    "PySide6>=6.8",
    "obd>=0.7.2",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "pre-commit>=4.0",
]


[project.scripts]
smart-dash = "app.main:main"


[tool.setuptools.packages.find]
include = ["app*"]


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"


# ============================================================
# Ruff
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]


[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # import sorting
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

ignore = [
    "E501",   # line length handled by Ruff formatter
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"