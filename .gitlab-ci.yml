stages:
  - lint
  - test
  - build


variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_TLS_CERTDIR: "/certs"


cache:
  paths:
    - .cache/pip


# ============================================================
# Lint
# ============================================================

lint:
  stage: lint

  image: python:3.12-slim

  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

  script:
    - ruff check .
    - ruff format --check .

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG


# ============================================================
# Test
# ============================================================

pytest:
  stage: test

  image: python:3.12-slim

  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

  script:
    - pytest

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG


# ============================================================
# Docker Build
# ============================================================

docker-build:
  stage: build

  image: docker:27

  services:
    - name: docker:27-dind
      alias: docker

  before_script:
    - docker info

  script:
    - docker build
        --pull
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        .

  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG